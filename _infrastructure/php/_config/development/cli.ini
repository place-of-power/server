memory_limit = 1G
max_execution_time = 0

pcov.enabled = 1
pcov.directory = /var/www/app/app

error_reporting = E_ALL
display_errors = 1
log_errors = 1

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

date.timezone = Europe/Moscow
max_input_vars = 3000